services:
  promitto:
    # Prebuilt and shipped by .github/workflows/deploy.yml — deliberately no
    # `build:` key, so the 1GB VPS can never be talked into building here.
    image: promitto:deploy
    container_name: promitto
    restart: unless-stopped
    # Must exceed SHUTDOWN_TIMEOUT_MS in backend/src/main.ts, or Docker's 10s
    # default SIGKILLs mid-shutdown and the graceful path can never run —
    # cutting a send mid-flight and stranding the row's picked_at lease.
    stop_grace_period: 40s
    # Node + Baileys sockets; the box has ~960MB total and every other service
    # is capped too. Raise this before adding paired numbers, not after an OOM.
    mem_limit: 384m
    # Until this existed there was no rotation anywhere — no /etc/docker/daemon.json
    # on the host either — so container logs grew without bound forever. Adding
    # 5-minute memory telemetry on top of that would have made it worse, which is
    # why this landed first. 50MB ceiling; at 288 telemetry lines/day it is months
    # of history.
    # Per-service and NOT via daemon.json deliberately: a daemon-level default
    # needs the Docker daemon restarted, which restarts every container on this
    # box — including the live paired WhatsApp session and Traefik. A compose key
    # costs one promitto restart, on our schedule.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-https://wa.muhfaza.my.id}
      SESSION_SECRET: ${SESSION_SECRET}
      # Optional. Unset renders as an empty string here and is normalized back
      # to "unset" in config/env.ts, which falls back to SESSION_SECRET.
      CSRF_SECRET: ${CSRF_SECRET:-}
      DATABASE_PATH: /app/backend/data/promitto.db
      SESSIONS_DIR: /app/backend/data/sessions
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BAILEYS_LOG_LEVEL: ${BAILEYS_LOG_LEVEL:-silent}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
      TRUST_PROXY: "true"
      # Retention deletes permanently and there are no backups, so the first
      # deploy of this feature runs with this set to true in ~/promitto/.env:
      # the sweeper logs what it *would* delete and deletes nothing, giving
      # users a window to pick 90/180 days before the 60-day default bites
      # retroactively. Remove it from .env to arm the sweeper for real.
      RETENTION_DRY_RUN: ${RETENTION_DRY_RUN:-false}
      # This pins determinism, it does not add headroom. V8 derives its heap cap
      # from HOST RAM rather than the cgroup, and on this 965MB box it was
      # already choosing ~259MB — so the old 256 was a hair *below* what it
      # picked anyway. 192MB leaves ~190MB of the 384m limit for the Node
      # baseline, new-space, better-sqlite3 and the whatsapp-rust-bridge WASM
      # linear memory, which is what keeps the process inside the cgroup: an
      # abort from V8 is survivable, a cgroup SIGKILL is not necessarily.
      # useMultiFileAuthState writes creds.json with a plain writeFile and no
      # atomic rename, so a SIGKILL landing mid-write truncates the credentials
      # of a live pairing. That is the reason to stay under the limit.
      # The actual fix for the every-few-days heap deaths was removing the
      # per-creds.update chmod sweep in manager.ts, not this line — don't read
      # it as "the OOM is handled". Raise this and mem_limit together, never
      # this alone.
      # --heapsnapshot-near-heap-limit=1 is what finally settles whether a slow
      # retention leak exists underneath the churn: it dumps a full heap the
      # moment V8 is about to abort, which is the one moment nobody has ever
      # managed to catch by hand. `=1` is per PROCESS lifetime, not per host —
      # `restart: unless-stopped` means a crash loop writes one per restart, so
      # delete them once analysed; nothing prunes them.
      # --diagnostic-dir is what makes the snapshot survive. Verified on
      # node:20-alpine, not assumed: this flag writes to --diagnostic-dir, and
      # falls back to the process CWD when unset. CWD here is /app/backend (set
      # by the Dockerfile WORKDIR and again by entrypoint.sh), which is INSIDE
      # the container — the snapshot would be destroyed with it and we would
      # learn nothing. /app/backend/data is the bind mount. Both flags are
      # NODE_OPTIONS-permitted; also verified.
      # The file is up to ~195MB and is written *during* a memory crisis, so it
      # costs seconds of stall on a box already thrashing — acceptable, since
      # the process is aborting anyway. 38GB free, so space is not the concern.
      # It is written 0600 and contains everything in memory: message text,
      # session cookies, Baileys keys. Treat it like the DB, not like a log.
      NODE_OPTIONS: >-
        --max-old-space-size=192
        --heapsnapshot-near-heap-limit=1
        --diagnostic-dir=/app/backend/data
    volumes:
      - ./backend/data:/app/backend/data
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.promitto.rule=Host(`wa.muhfaza.my.id`)
      - traefik.http.routers.promitto.entrypoints=websecure
      - traefik.http.routers.promitto.tls=true
      - traefik.http.routers.promitto.tls.certresolver=le
      - traefik.http.services.promitto.loadbalancer.server.port=3000
      - traefik.http.routers.promitto.middlewares=promitto-hsts@docker
      - traefik.http.middlewares.promitto-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.promitto-hsts.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.promitto-hsts.headers.stsPreload=true

networks:
  web:
    external: true
